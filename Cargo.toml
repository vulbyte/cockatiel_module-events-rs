[package]
name = "cockatiel_events"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — chat events: zero-sum predictions (!pred) and free-vote polls (!poll), one shared display window"
license = "GPL-2.0"

[[bin]]
name = "event_brain"
path = "src/bin/event_brain.rs"

[[bin]]
name = "event_display"
path = "src/bin/event_display.rs"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "a5ab204d8f2adfd93de218bd66eff8db9d7abe6f" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"